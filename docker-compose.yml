services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ag_peptides
      POSTGRES_USER: ag_peptides
      POSTGRES_PASSWORD: ag_peptides_dev
    ports:
      - "5432:5432"
    volumes:
      - ag_peptides_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag_peptides -d ag_peptides"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ag_peptides_pg:
